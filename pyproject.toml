[project]
name = "beliefbench"
version = "0.1.0"
description = "BeliefGraph-Bench: scenario generator and deterministic gold labeller for selective belief revision"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
beliefbench = "beliefbench.cli:main"
beliefgraph = "beliefgraph.cli:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.15.0",
]
openai = [
    "openai>=3.35.1",
]
gemini = [
    "google-genai>=2.31.0",
]
embed = [
    "fastembed>=0.9.0",
    "scipy>=1.17.1",
]

[dependency-groups]
audit = [
    "veritas-tms==0.16.0",
]
dev = ["pytest>=8"]
lyzr = [
    "lyzr-adk==0.1.12",
]
modal = [
    "modal>=1.6.2",
]
# Memory-system baseline: Mem0 1.0.5, the last release with the ADD/UPDATE/DELETE/NONE update step of
# the Mem0 paper (arXiv 2504.19413); 2.x is additive only.
mem0 = [
    "mem0ai==1.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beliefbench", "src/beliefgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
