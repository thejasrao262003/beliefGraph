[project]
name = "beliefbench"
version = "0.1.0"
description = "BeliefGraph-Bench: scenario generator and deterministic gold labeller for selective belief revision"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
beliefbench = "beliefbench.cli:main"
beliefgraph = "beliefgraph.cli:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.15.0",
]
openai = [
    "openai>=3.35.1",
]
gemini = [
    "google-genai>=2.31.0",
]

[dependency-groups]
audit = [
    "veritas-tms==0.16.0",
]
dev = ["pytest>=8"]
lyzr = [
    "lyzr-adk==0.1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beliefbench", "src/beliefgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
