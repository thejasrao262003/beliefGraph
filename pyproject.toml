[project]
name = "beliefbench"
version = "0.1.0"
description = "BeliefGraph-Bench: scenario generator and deterministic gold labeller for selective belief revision"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
beliefbench = "beliefbench.cli:main"

[dependency-groups]
audit = [
    "veritas-tms==0.16.0",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beliefbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
